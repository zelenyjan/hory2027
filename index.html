<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#e7eefb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111a2e" media="(prefers-color-scheme: dark)" />
    <title>Hory 2027</title>
    <script>
      // Applied before first paint so a night-mode reload never flashes snow white.
      (function () {
        var theme = localStorage.getItem('hory-theme') || 'light';
        var dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
